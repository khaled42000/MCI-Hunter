name: Run MCI Hunter

on:
  workflow_dispatch:      # برای اجرای دستی
  schedule:
    - cron: '0 */1 * * *' # اجرای خودکار هر 6 ساعت

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install Requests
        run: pip install requests

      - name: Run Script
        run: python main.py

      - name: Save Results
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          git add sub.txt
          git commit -m "Updated Configs" || echo "No changes"
          git push
